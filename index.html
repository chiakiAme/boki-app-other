<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Park // 簿記アドベンチャー</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --red: #e21b2d;
      --yellow: #ffd43b;
      --yellow-dark: #e5a900;
      --black: #171717;
      --white: #ffffff;
      --pink: #f7a6b8;
      --text: #2b2118;
      --muted: #806f60;
      --border: #ead8b4;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text);
      background-color: #fff8df;
      padding: 16px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border: 4px solid var(--red);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 0 var(--black);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 3px solid var(--black);
      margin-bottom: 14px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .mouse-logo-svg { width: 50px; height: 46px; flex-shrink: 0; }
    .logo-title { margin: 0; font-size: 1.1rem; color: var(--red); font-weight: 900; }
    .status-badge {
      background: var(--red);
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      border: 2px solid var(--black);
      font-size: 0.72rem;
      font-weight: 900;
    }
    .status-badge.review {
      background: var(--yellow);
      color: var(--black);
    }
    .park-progress {
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #fff7d6;
      border: 2px solid var(--yellow-dark);
      border-radius: 14px;
    }
    .progress-track {
      height: 12px;
      width: 100%;
      background: #f7e6a9;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--red);
      transition: width 0.3s ease;
    }
    .card {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .question-label {
      display: inline-block;
      background: var(--red);
      color: white;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .story-text { margin: 0; font-size: 0.95rem; line-height: 1.6; }
    .split-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    @media(max-width: 560px) { .split-container { grid-template-columns: 1fr; } }
    .side-column {
      padding: 12px;
      background: #fffdf4;
      border: 2px solid var(--yellow);
      border-radius: 14px;
    }
    .side-column.credit { background: #fff4f5; border-color: var(--pink); }
    .side-title { text-align: center; margin-bottom: 8px; font-weight: 900; font-size: 0.85rem; }
    .entry-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .entry-row input {
      padding: 8px;
      border: 2px solid #e7d7b6;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 100%;
    }
    .entry-row input[type="text"] { flex: 1.3; }
    .entry-row input[type="number"] { flex: 1; }
    .btn-remove {
      background: #ffe4e6;
      border: 1px solid #fda4af;
      border-radius: 6px;
      color: var(--red);
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add {
      width: 100%;
      padding: 6px;
      background: white;
      border: 1px dashed var(--yellow-dark);
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
    }
    .credit .btn-add {
      border-color: var(--pink);
      color: #9f1239;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: white;
      border: 3px solid var(--black);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--black);
      touch-action: manipulation;
    }
    .result-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .result-box.correct { background: #dcfce7; border: 2px solid #86efac; color: #166534; }
    .result-box.wrong { background: #fee2e2; border: 2px solid #fda4af; color: #991b1b; }
    .nav-buttons { display: flex; gap: 10px; margin-top: 14px; }
    .nav-btn {
      flex: 1;
      padding: 10px;
      background: var(--black);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .clear-card { display: none; text-align: center; padding: 24px 16px; }
    .badge-complete {
      display: inline-block;
      padding: 8px 16px;
      background: #fef08a;
      border: 2px solid var(--black);
      border-radius: 999px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .btn-review, .btn-restart {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--black);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-review { background: var(--yellow); color: var(--black); }
    .btn-restart { background: #475569; color: white; }

    /* JSON読み込み窓 */
    details {
      margin-top: 20px;
      border-top: 2px dashed #d9bd83;
      padding-top: 14px;
    }
    summary {
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-top: 10px;
      padding: 10px;
      border: 2px solid #dfc99c;
      border-radius: 10px;
      font-size: 0.8rem;
      font-family: monospace;
      resize: vertical;
      outline: none;
    }
    .load-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: var(--yellow);
      color: var(--black);
      border: 2px solid var(--black);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--black);
    }
    .reset-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
    }

    /* 不正解時の画面ブルブル（シェイク） */
    .shake-animation {
      animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    /* ==================================================
       ★ 新演出：下からフワァ〜ッと舞い上がるアニメーション
    ================================================== */
    .rising-item {
      position: fixed;
      bottom: -30px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: riseUp ease-out forwards;
    }
    @keyframes riseUp {
      0% {
        transform: translateY(0) translateX(0) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.95;
      }
      50% {
        transform: translateY(-50vh) translateX(var(--drift, 20px)) scale(1.1) rotate(180deg);
        opacity: 0.9;
      }
      85% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-110vh) translateX(calc(var(--drift, 20px) * -1)) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="header">
    <div class="logo-area">
      <!-- 黄金比率シルエット -->
      <svg class="mouse-logo-svg" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="26" r="18" fill="#171717" />
        <circle cx="76" cy="26" r="18" fill="#171717" />
        <circle cx="50" cy="55" r="30" fill="#171717" />
        <circle cx="50" cy="55" r="8" fill="#ffd43b" />
      </svg>
      <div>
        <h1 class="logo-title">マジックパーク簿記</h1>
        <div style="font-size:0.7rem; color:var(--muted);">〜 魔法の仕訳アドベンチャー 〜</div>
      </div>
    </div>
    <span class="status-badge" id="status-tag">🎡 探索中</span>
  </div>

  <div class="park-progress">
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold;">
      <span>🎟️ 探索ゲージ</span>
      <span id="progress-text">第 1 問</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- クイズエリア -->
  <div id="quiz-area">
    <div class="card">
      <div class="question-label" id="q-number">アトラクション // 01</div>
      <p class="story-text" id="story-display">読み込み中...</p>
    </div>

    <div class="split-container">
      <div class="side-column">
        <div class="side-title">🖤 借方 (Debit)</div>
        <div id="debit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('debit')">＋ 行を追加</button>
      </div>
      <div class="side-column credit">
        <div class="side-title">❤️ 貸方 (Credit)</div>
        <div id="credit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('credit')">＋ 行を追加</button>
      </div>
    </div>

    <button type="button" class="btn-submit" id="submit-btn" onclick="checkAnswer()">✨ 魔法の仕訳を判定する！</button>
    <div id="result-display" class="result-box"></div>

    <div class="nav-buttons">
      <button type="button" class="nav-btn" onclick="prevQuestion()">◀ 前へ</button>
      <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">次へ ▶</button>
    </div>
  </div>

  <!-- 終了画面 -->
  <div id="clear-area" class="clear-card">
    <h2>🏰 パーク完全攻略！</h2>
    <div id="complete-badge-area"></div>
    <p id="score-text" style="line-height:1.6; color:var(--muted);"></p>
    <div id="review-btn-area"></div>
    <button type="button" class="btn-restart" onclick="startFreshQuiz()">最初からもう一度あそぶ 🎠</button>
  </div>

  <!-- 問題追加の窓 -->
  <details>
    <summary>🎟️ 新しいアトラクション問題データを読み込む (JSON)</summary>
    <textarea id="json-input" placeholder="AIが作成した問題データ（[ ... ]）をここに貼り付けます"></textarea>
    <button type="button" class="load-btn" onclick="loadCustomData()">🗝️ 新しい問題をパークに追加</button>
  </details>

  <span class="reset-link" onclick="forceReset()">※ 画面がおかしいときはここを押してデータを初期化</span>
</div>

<script>
const defaultData = [
  {
    "story": "魔法のパークを開くため、代表者が自分のお金 500,000円を元入れした（出資した）。（資本金）",
    "debit": [{ "account": "現金", "amount": 500000 }],
    "credit": [{ "account": "資本金", "amount": 500000 }],
    "explanation": "現金（Cash: 資産）の増加は借方、資本金（Capital: 純資産）の増加は貸方に記入します。"
  },
  {
    "story": "パーク内店舗の家賃（支払家賃）70,000円を現金で支払った。（支払家賃）",
    "debit": [{ "account": "支払家賃", "amount": 70000 }],
    "credit": [{ "account": "現金", "amount": 70000 }],
    "explanation": "支払家賃（費用: Expense）の発生は借方、現金（資産: Asset）の減少は貸方に記入します。"
  },
  {
    "story": "パークのアトラクション管理用サーバー（備品）200,000円を購入し、普通預金から支払った。（備品）",
    "debit": [{ "account": "備品", "amount": 200000 }],
    "credit": [{ "account": "普通預金", "amount": 200000 }],
    "explanation": "備品（資産）の増加は借方、普通預金（資産）の減少は貸方に記入します。"
  },
  {
    "story": "ショップで販売する限定グッズ（商品）90,000円分を掛けで仕入れた。（仕入）（買掛金）",
    "debit": [{ "account": "仕入", "amount": 90000 }],
    "credit": [{ "account": "買掛金", "amount": 90000 }],
    "explanation": "仕入（費用）の発生は借方、買掛金（負債: Liability）の増加は貸方に記入します。"
  },
  {
    "story": "ツアー客へグッズ 140,000円を掛けで販売した。（売掛金）（売上）",
    "debit": [{ "account": "売掛金", "amount": 140000 }],
    "credit": [{ "account": "売上", "amount": 140000 }],
    "explanation": "売掛金（資産）の増加は借方、売上（収益: Revenue）の発生は貸方に記入します。"
  },
  {
    "story": "先月販売したグッズ代金の売掛金 60,000円が当座預金口座へ振り込まれた。（当座預金）（売掛金）",
    "debit": [{ "account": "当座預金", "amount": 60000 }],
    "credit": [{ "account": "売掛金", "amount": 60000 }],
    "explanation": "当座預金（資産）の増加は借方、売掛金（資産）の減少は貸方に記入します。"
  },
  {
    "story": "仕入先への買掛金 50,000円を支払うため、小切手を振り出した（当座預金勘定を用いること）。（買掛金）（当座預金）",
    "debit": [{ "account": "買掛金", "amount": 50000 }],
    "credit": [{ "account": "当座預金", "amount": 50000 }],
    "explanation": "買掛金（負債）の減少は借方、当座預金（資産）の減少は貸方に記入します。"
  },
  {
    "story": "パレード運行を手伝い、お礼（受取手数料）として現金 30,000円を受け取った。（受取手数料）",
    "debit": [{ "account": "現金", "amount": 30000 }],
    "credit": [{ "account": "受取手数料", "amount": 30000 }],
    "explanation": "現金（資産）の増加は借方、受取手数料（収益）の発生は貸方に記入します。"
  },
  {
    "story": "手持ちの現金 120,000円を安全のため普通預金口座へ預け入れた。（普通預金）（現金）",
    "debit": [{ "account": "普通預金", "amount": 120000 }],
    "credit": [{ "account": "現金", "amount": 120000 }],
    "explanation": "普通預金（資産）の増加は借方、現金（資産）の減少は貸方に記入します。"
  },
  {
    "story": "オンラインシステムの手数料として、現金 10,000円を支払った（支払手数料勘定を用いること）。（支払手数料）",
    "debit": [{ "account": "支払手数料", "amount": 10000 }],
    "credit": [{ "account": "現金", "amount": 10000 }],
    "explanation": "支払手数料（費用）の発生は借方、現金（資産）の減少は貸方に記入します。"
  }
];

let baseQuestions = defaultData;
let currentQuestions = defaultData;
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let answeredSet = new Set();
let isReviewMode = false;

function init() {
  try {
    const saved = localStorage.getItem("magic_park_boki_data");
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) baseQuestions = parsed;
    }
  } catch (e) {
    baseQuestions = defaultData;
  }

  try {
    const savedIdx = localStorage.getItem("magic_park_current_idx");
    const savedCorrect = localStorage.getItem("magic_park_correct_cnt");
    const savedWrongs = localStorage.getItem("magic_park_wrong_list");
    const savedReview = localStorage.getItem("magic_park_is_review");

    isReviewMode = (savedReview === "true");
    wrongList = savedWrongs ? JSON.parse(savedWrongs) : [];
    currentQuestions = isReviewMode ? [...wrongList] : [...baseQuestions];
    correctCount = savedCorrect ? parseInt(savedCorrect, 10) : 0;
    currentIndex = savedIdx ? parseInt(savedIdx, 10) : 0;
  } catch (e) {
    currentQuestions = [...baseQuestions];
    currentIndex = 0;
  }

  if (!currentQuestions || currentQuestions.length === 0 || currentIndex >= currentQuestions.length || currentIndex < 0) {
    currentIndex = 0;
    currentQuestions = [...baseQuestions];
    isReviewMode = false;
  }

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";
  loadQuestion(currentIndex);
}

function createRowHTML(account = "", amount = "") {
  const div = document.createElement("div");
  div.className = "entry-row";
  div.innerHTML = `
    <input type="text" placeholder="科目" value="${account}">
    <input type="number" placeholder="金額" value="${amount}">
    <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
  `;
  return div;
}

function addRow(side) {
  const container = document.getElementById(`${side}-rows`);
  if (container) container.appendChild(createRowHTML());
}

function removeRow(btn) {
  const row = btn.closest(".entry-row");
  if (row && row.parentElement && row.parentElement.children.length > 1) {
    row.remove();
  } else {
    alert("最低1行は必要です。");
  }
}

function loadQuestion(index) {
  if (!currentQuestions || currentQuestions.length === 0) return;
  if (index < 0 || index >= currentQuestions.length) index = 0;
  currentIndex = index;

  try {
    localStorage.setItem("magic_park_current_idx", currentIndex);
    localStorage.setItem("magic_park_correct_cnt", correctCount);
    localStorage.setItem("magic_park_wrong_list", JSON.stringify(wrongList));
    localStorage.setItem("magic_park_is_review", isReviewMode);
  } catch(e) {}

  const tag = document.getElementById("status-tag");
  if (isReviewMode) {
    tag.textContent = "🔄 復習中";
    tag.className = "status-badge review";
  } else {
    tag.textContent = "🎡 探索中";
    tag.className = "status-badge";
  }

  const prefix = isReviewMode ? "🔄 復習" : "🎠 アトラクション";
  document.getElementById("q-number").textContent = `${prefix} // ${index + 1} / ${currentQuestions.length}`;
  document.getElementById("story-display").textContent = currentQuestions[index].story;

  document.getElementById("debit-rows").innerHTML = "";
  document.getElementById("credit-rows").innerHTML = "";
  addRow("debit");
  addRow("credit");

  const res = document.getElementById("result-display");
  res.style.display = "none";
  res.className = "result-box";
  document.getElementById("submit-btn").style.display = "block";

  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "結果を見る ✨" : "次へ ▶";

  const percent = Math.round(((index + 1) / currentQuestions.length) * 100);
  document.getElementById("progress-fill").style.width = percent + "%";
  document.getElementById("progress-text").textContent = `${index + 1} / ${currentQuestions.length} 問 (${percent}%)`;
}

function getEntries(side) {
  const container = document.getElementById(`${side}-rows`);
  if (!container) return [];
  const rows = container.children;
  const entries = [];
  for (let row of rows) {
    const inputs = row.querySelectorAll("input");
    if (inputs.length >= 2) {
      const account = inputs[0].value.trim();
      const amount = parseInt(inputs[1].value, 10);
      if (account && !isNaN(amount)) entries.push({ account, amount });
    }
  }
  return entries;
}

/* ==================================================
   ★ 正解時に「下からフワァ〜ッ」と舞い上がるエフェクト
================================================== */
function spawnRisingMagic() {
  const symbols = ["✨", "⭐", "🎈", "🎀", "💖", "💛", "🪙", "🏰"];
  const totalItems = 30;

  for (let i = 0; i < totalItems; i++) {
    const item = document.createElement("div");
    item.className = "rising-item";
    item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    
    // 画面の横幅全体にランダム配置
    item.style.left = (Math.random() * 92 + 4) + "vw";
    
    // フワフワと左右に漂う揺れ幅を設定
    const driftX = (Math.random() * 80 - 40) + "px";
    item.style.setProperty("--drift", driftX);

    // 大きさとフワァと昇る速度
    const size = Math.random() * 18 + 20; // 20px〜38px
    const duration = Math.random() * 1.6 + 2.0; // 2.0s〜3.6s（ゆっくり浮上）
    const delay = Math.random() * 0.5; // 0s〜0.5s時間差でポコポコ湧き上がる

    item.style.fontSize = size + "px";
    item.style.animationDuration = duration + "s";
    item.style.animationDelay = delay + "s";

    document.body.appendChild(item);

    // アニメーション完了後に自動で消去
    setTimeout(() => {
      item.remove();
    }, (duration + delay) * 1000);
  }
}

/* ==================================================
   ★ 不正解時に画面をブルブル震わせる
================================================== */
function triggerShake() {
  const container = document.getElementById("mainContainer");
  container.classList.remove("shake-animation");
  void container.offsetWidth; // リフロー
  container.classList.add("shake-animation");

  setTimeout(() => {
    container.classList.remove("shake-animation");
  }, 500);
}

function checkAnswer() {
  const q = currentQuestions[currentIndex];
  const userDebit = getEntries("debit");
  const userCredit = getEntries("credit");

  const normalize = d => Array.isArray(d) ? d : [d];
  const cDebit = normalize(q.debit);
  const cCredit = normalize(q.credit);

  const matchSide = (u, c) => {
    if (u.length !== c.length) return false;
    const sU = [...u].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    const sC = [...c].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    return sU.every((v, i) => v.account === sC[i].account && v.amount === sC[i].amount);
  };

  const isOk = matchSide(userDebit, cDebit) && matchSide(userCredit, cCredit);
  const res = document.getElementById("result-display");
  res.style.display = "block";

  if (isOk) {
    // ★ 正解時：下からフワァ〜ッと舞い上がる！
    spawnRisingMagic();

    res.className = "result-box correct";
    res.innerHTML = `<strong>⭐ 大正解！</strong><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      correctCount++;
      if (isReviewMode) wrongList = wrongList.filter(item => item.story !== q.story);
      answeredSet.add(currentIndex);
    }
  } else {
    // ★ 不正解時：画面全体がブルブル揺れる
    triggerShake();

    res.className = "result-box wrong";
    const dStr = cDebit.map(d => `(${d.account}: ${d.amount.toLocaleString()}円)`).join(" ");
    const cStr = cCredit.map(c => `(${c.account}: ${c.amount.toLocaleString()}円)`).join(" ");
    res.innerHTML = `<strong>🎀 おしい！もう一度確認しよう</strong><br>借方: ${dStr}<br>貸方: ${cStr}<br><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      if (!wrongList.some(item => item.story === q.story)) wrongList.push(q);
      answeredSet.add(currentIndex);
    }
  }

  try {
    localStorage.setItem("magic_park_correct_cnt", correctCount);
    localStorage.setItem("magic_park_wrong_list", JSON.stringify(wrongList));
  } catch(e) {}
}

function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
  else showClearScreen();
}

function showClearScreen() {
  document.getElementById("quiz-area").style.display = "none";
  const clearArea = document.getElementById("clear-area");
  clearArea.style.display = "block";

  const total = currentQuestions.length;
  const badgeArea = document.getElementById("complete-badge-area");
  const scoreText = document.getElementById("score-text");
  const revArea = document.getElementById("review-btn-area");

  badgeArea.innerHTML = "";
  revArea.innerHTML = "";

  if (wrongList.length === 0) {
    spawnRisingMagic();
    badgeArea.innerHTML = `<div class="badge-complete">🏆 パーク完全攻略！</div>`;
    scoreText.innerHTML = `全問正解です！おめでとうございます！ (${total}/${total})`;
  } else {
    scoreText.innerHTML = `${total}問中 ${correctCount}問 正解でした。<br>あと ${wrongList.length}問 復習できます。`;
    const btn = document.createElement("button");
    btn.className = "btn-review";
    btn.textContent = `🔄 間違えた問題だけ復習する (${wrongList.length}問)`;
    btn.onclick = () => {
      isReviewMode = true;
      currentQuestions = [...wrongList];
      currentIndex = 0;
      correctCount = 0;
      answeredSet.clear();
      document.getElementById("quiz-area").style.display = "block";
      clearArea.style.display = "none";
      loadQuestion(0);
    };
    revArea.appendChild(btn);
  }
}

function startFreshQuiz() {
  forceReset();
}

function forceReset() {
  localStorage.clear();
  location.reload();
}

function loadCustomData() {
  const input = document.getElementById("json-input").value.trim();
  if (!input) {
    alert("JSONデータを貼り付けてください。");
    return;
  }
  try {
    const data = JSON.parse(input);
    if (!Array.isArray(data) || data.length === 0) throw new Error();

    baseQuestions = data;
    localStorage.setItem("magic_park_boki_data", JSON.stringify(data));
    localStorage.removeItem("magic_park_current_idx");
    localStorage.removeItem("magic_park_correct_cnt");
    localStorage.removeItem("magic_park_wrong_list");
    localStorage.removeItem("magic_park_is_review");

    currentQuestions = [...baseQuestions];
    currentIndex = 0;
    correctCount = 0;
    wrongList = [];
    isReviewMode = false;
    answeredSet.clear();

    document.getElementById("quiz-area").style.display = "block";
    document.getElementById("clear-area").style.display = "none";
    loadQuestion(0);
    alert(`新しいストーリー（全${baseQuestions.length}問）を読み込みました！`);
  } catch (e) {
    alert("⚠️ JSONデータの形式を確認してください。正しく貼り付けられているかチェックをお願いします。");
  }
}

window.addEventListener("DOMContentLoaded", init);
</script>
